services:
  - type: web
    runtime: node
    name: mahru-store
    plan: free
    buildCommand: >-
      cd Frontend && npm install --include=dev && npm run build &&
      cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ADMIN_KEY
        generateValue: true
